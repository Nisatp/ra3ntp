<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1</title>
    <script>
        function abrirVentanaFinAnio() {
            // Abro la ventana con window.open fijando el tamaño en 600x400
            let miVentana = window.open("", "nueva", "width=600,height=400");
            
            // Instancio el objeto Date actual para extraer el día, mes y año de hoy
            let hoy = new Date();
            let dia = hoy.getDate();
            let mes = hoy.getMonth() + 1; // Sumo 1 porque los meses van de 0 a 11
            let anio = hoy.getFullYear();
            
            // Creo otra fecha fijada en el 31 de diciembre del año actual
            let finAnio = new Date(anio, 11, 31); 
            
            // Saco la diferencia de tiempo exacta expresada en milisegundos
            let diferenciaMilisegundos = finAnio - hoy;
            
            // Paso los milisegundos a días usando Math.ceil para redondear al alza
            let diasRestantes = Math.ceil(diferenciaMilisegundos / (1000 * 60 * 60 * 24));
            
            // Inyecto el texto formateado directamente en la ventana abierta
            miVentana.document.write(`
                <h2>Hoy es ${dia}/${mes}/${anio} y faltan ${diasRestantes} días para fin de año.</h2>
            `);
        }
    </script>
</head>
<body>
    <h2>Ejercicio 1: Apertura de ventana emergente</h2>
    <button onclick="abrirVentanaFinAnio()">Abrir Ventana</button>
</body>
</html>
